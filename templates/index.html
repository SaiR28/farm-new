<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neural Kissan Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #2d3436;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #27ae60;
      margin-bottom: 10px;
    }
    .datetime {
      text-align: center;
      color: #636e72;
      margin-bottom: 20px;
    }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .card h2 {
      margin: 0;
      font-size: 18px;
      color: #09804c;
    }
    .value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
      color: #2d3436;
    }
    .timestamp, .received {
      font-size: 13px;
      color: #636e72;
      margin-top: 5px;
    }
    .received.late {
      color: #e74c3c;
    }

    .chart-section {
      margin: 40px 0;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    .images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .images img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .images img:hover {
      transform: scale(1.02);
    }

    .buttons {
      text-align: center;
      margin: 30px 0;
    }

    .btn {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      background: #27ae60;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #219150;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .modal.active {
      display: flex;
    }
  </style>
</head>
<body>
  <h1>Neural Kissan Dashboard</h1>
  <div class="datetime" id="datetime">Loading time...</div>

  <div class="dashboard">
    <div class="card">
      <h2>Temperature</h2>
      <div class="value" id="temperature">-- °C</div>
      <div class="timestamp" id="temp-timestamp">--</div>
      <div class="received" id="temp-received">--</div>
    </div>
    <div class="card">
      <h2>Humidity</h2>
      <div class="value" id="humidity">-- %</div>
      <div class="timestamp" id="humid-timestamp">--</div>
      <div class="received" id="humid-received">--</div>
    </div>
  </div>

  <div class="chart-section">
    <canvas id="sensorChart" height="300"></canvas>
  </div>

  <div class="buttons">
    <button class="btn" onclick="window.location.href='/api/download_csv'">Download Sensor Data (CSV)</button>
    <button class="btn" onclick="window.location.href='/api/download_zip'">Download Images (ZIP)</button>
  </div>

  <div class="images" id="imageContainer">
    <!-- Dynamically loaded images -->
  </div>

  <div class="modal" id="modal" onclick="this.classList.remove('active')">
    <img id="modalImage" src="" alt="Full Image" />
  </div>

  <script>
    const chart = new Chart(document.getElementById('sensorChart'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Temperature (°C)',
            data: [],
            borderColor: '#e67e22',
            fill: false
          },
          {
            label: 'Humidity (%)',
            data: [],
            borderColor: '#3498db',
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'top' } },
        scales: { x: { display: true }, y: { display: true } }
      }
    });

    function updateTime() {
      document.getElementById('datetime').innerText = new Date().toLocaleString();
    }

    function formatDiff(seconds) {
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }

    function updateSensors() {
      fetch('/api/latest_sensor_data')
        .then(res => res.json())
        .then(data => {
          const ts = new Date(data.timestamp);
          const now = new Date();
          const diffSec = Math.floor((now - ts) / 1000);

          document.getElementById('temperature').innerText = `${data.temperature.toFixed(1)} °C`;
          document.getElementById('humidity').innerText = `${data.humidity.toFixed(1)} %`;

          document.getElementById('temp-timestamp').innerText = `Updated: ${ts.toLocaleString()}`;
          document.getElementById('humid-timestamp').innerText = `Updated: ${ts.toLocaleString()}`;

          const tempReceived = document.getElementById('temp-received');
          const humidReceived = document.getElementById('humid-received');

          tempReceived.innerText = `Last received: ${formatDiff(diffSec)}`;
          humidReceived.innerText = `Last received: ${formatDiff(diffSec)}`;

          tempReceived.className = `received ${diffSec > 300 ? 'late' : ''}`;
          humidReceived.className = `received ${diffSec > 300 ? 'late' : ''}`;

          // Chart update
          if (chart.data.labels.length >= 10) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
            chart.data.datasets[1].data.shift();
          }
          chart.data.labels.push(ts.toLocaleTimeString());
          chart.data.datasets[0].data.push(data.temperature);
          chart.data.datasets[1].data.push(data.humidity);
          chart.update();
        });
    }

    function loadImages() {
      fetch('/api/latest_images')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('imageContainer');
          container.innerHTML = '';
          for (const [key, val] of Object.entries(data)) {
            const img = document.createElement('img');
            img.src = val.url;
            img.alt = key;
            img.onclick = () => {
              document.getElementById('modalImage').src = val.url;
              document.getElementById('modal').classList.add('active');
            };
            container.appendChild(img);
          }
        });
    }

    setInterval(() => {
      updateTime();
      updateSensors();
    }, 5000);

    updateTime();
    updateSensors();
    loadImages();
  </script>
</body>
</html>
